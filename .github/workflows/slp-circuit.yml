name: SLP R-Zig-Python circuit
on:
  push:
    paths:
      - 'native/zig/**'
      - 'r/**'
      - 'scripts/slp_protocol.py'
      - 'scripts/zig_bridge.py'
      - 'tests/test_slp_circuit.py'
      - 'tests/test_slp_r_circuit.R'
      - '.github/workflows/slp-circuit.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/zig/**'
      - 'r/**'
      - 'scripts/slp_protocol.py'
      - 'scripts/zig_bridge.py'
      - 'tests/test_slp_circuit.py'
      - 'tests/test_slp_r_circuit.R'
      - '.github/workflows/slp-circuit.yml'
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.13.0'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install numpy pytest
      - name: Compile Zig numerical kernels and R ABI
        run: zig build-lib -dynamic -O ReleaseSafe native/zig/combined.zig -femit-bin=libsemantic_core.so
      - name: Test Zig protocol
        run: zig test native/zig/slp_protocol.zig
      - name: Test Python protocol and native circuit
        env:
          SLP_ZIG_LIBRARY: ${{ github.workspace }}/libsemantic_core.so
        run: python -m pytest -q tests/test_slp_circuit.py -rs
      - name: Test R protocol and native circuit
        env:
          SLP_ZIG_LIBRARY: ${{ github.workspace }}/libsemantic_core.so
        run: Rscript tests/test_slp_r_circuit.R
