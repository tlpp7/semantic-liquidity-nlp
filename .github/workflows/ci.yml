name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python unit and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full Python test suite
        run: python -m pytest -q

  slp-native:
    name: R Zig Python native circuit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.13.0'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install protocol test dependencies
        run: python -m pip install numpy pytest
      - name: Compile Zig native kernels and R ABI
        run: zig build-lib -dynamic -O ReleaseSafe native/zig/combined.zig -femit-bin=libsemantic_core.so
      - name: Zig protocol unit tests
        run: zig test native/zig/slp_protocol.zig
      - name: Python protocol and native ABI tests
        env:
          SLP_ZIG_LIBRARY: ${{ github.workspace }}/libsemantic_core.so
        run: python -m pytest -q tests/test_slp_circuit.py -rs
      - name: R protocol and native ABI tests
        env:
          SLP_ZIG_LIBRARY: ${{ github.workspace }}/libsemantic_core.so
        run: Rscript tests/test_slp_r_circuit.R

  ci-gate:
    name: General circuit gate
    if: always()
    needs: [python-tests, slp-native]
    runs-on: ubuntu-latest
    steps:
      - name: Require all circuit jobs to succeed
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          NATIVE_RESULT: ${{ needs.slp-native.result }}
        run: |
          echo "Python: $PYTHON_RESULT"
          echo "R/Zig/SLP: $NATIVE_RESULT"
          test "$PYTHON_RESULT" = success
          test "$NATIVE_RESULT" = success
